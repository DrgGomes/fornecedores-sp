<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fornecedores SP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
  <style>
/* Skip artifact shell — fixed styles served beside every artifact.
   Complements basecoat; artifacts override --accent for their own identity. */
:root {
  color-scheme: light dark;
  --accent: #2563eb;
  --accent-contrast: #ffffff;
  --accent-text: color-mix(in srgb, var(--accent) 72%, #000);
  --bg: #f8f9fb;
  --surface: #ffffff;
  --text: #14171f;
  --text-muted: #5b6472;
  --border: rgba(20, 23, 31, 0.10);
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20, 23, 31, 0.08);
  --space: 16px;
}
/* Theme resolution. Without data-theme the viewer's system preference decides,
   as it always did. With it, the artifact's own choice wins in BOTH directions:
   a page that hardcodes one palette must not be handed the opposite set of
   tokens by the machine it happens to be opened on. The dark values appear
   twice because a media query cannot be folded into a selector list.
   The attribute sits inside :where() so these blocks keep the specificity of a
   bare :root — the page's own <style> is linked after this file and must go on
   overriding any token it wants, exactly as it could before. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
    --bg: #101318;
    --surface: #181c23;
    --text: #eef1f6;
    --text-muted: #9aa4b2;
    --border: rgba(238, 241, 246, 0.12);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}
:root:where([data-theme="dark"]) {
  color-scheme: dark;
  --accent-text: color-mix(in srgb, var(--accent) 78%, #fff);
  --bg: #101318;
  --surface: #181c23;
  --text: #eef1f6;
  --text-muted: #9aa4b2;
  --border: rgba(238, 241, 246, 0.12);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
:root:where([data-theme="light"]) { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }

.shell-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.shell-section { padding: calc(var(--space) * 2) 0; }
.shell-grid { display: grid; gap: var(--space); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.shell-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--space); }
.shell-footer { padding: 24px 0 40px; color: var(--text-muted); font-size: 13px; }

.shell-hero { padding: calc(var(--space) * 3) 0 calc(var(--space) * 2); }
.shell-hero h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.15; margin: 0 0 10px; text-wrap: balance; }
.shell-hero p { color: var(--text-muted); max-width: 60ch; margin: 0; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: var(--space);
}

.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .kpi-value { font-size: 28px; font-weight: 650; line-height: 1.1; }
.kpi .kpi-label { font-size: 13px; color: var(--text-muted); }
.kpi .kpi-delta { font-size: 12.5px; font-weight: 600; }
.kpi .kpi-delta.up { color: #0a8f3c; }
.kpi .kpi-delta.down { color: #cf3131; }

table.shell-table { border-collapse: collapse; width: 100%; font-size: 14px; }
table.shell-table th {
  text-align: left; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600;
}
table.shell-table th, table.shell-table td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--border); }
table.shell-table td.num, table.shell-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.shell-table tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }

.chart-box { width: 100%; min-height: 220px; }
.chart-box svg { width: 100%; height: auto; display: block; }

.muted { color: var(--text-muted); }
.accent { color: var(--accent-text); }
.shell-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent-text);
}

@media (prefers-reduced-motion: no-preference) {
  .shell-fade { animation: shell-fade 400ms ease both; }
  @keyframes shell-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

</style>
  <style>
    :root {
      --accent: #2563eb;
      --gradient-brand: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    /* HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--gradient-brand);
      color: #ffffff;
      padding: 12px 16px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.2);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 960px;
      margin: 0 auto;
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.02em;
    }
    .brand-badge {
      background: rgba(255, 255, 255, 0.22);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .header-btn:active {
      transform: scale(0.97);
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 960px;
      margin: 8px auto 0 auto;
      font-size: 0.78rem;
      opacity: 0.95;
    }
    .cloud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.72rem;
      transition: all 0.2s ease;
    }
    .cloud-pill.online {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .cloud-pill.offline {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    /* MAIN CONTAINER */
    .app-main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* SEARCH & FILTER CONTROLS */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* FILTER CHIPS */
    .chips-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }
    .chip {
      background: #ffffff;
      color: #475569;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
      box-shadow: var(--shadow-sm);
    }
    .chip.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    /* CARD LIST */
    .vendors-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .vendors-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 900px) {
      .vendors-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .vendor-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      position: relative;
    }
    .vendor-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .card-top {
      display: flex;
      gap: 12px;
      padding: 14px;
      align-items: center;
    }
    .vendor-avatar {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      flex-shrink: 0;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #334155;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .vendor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vendor-info {
      flex: 1;
      min-width: 0;
    }
    .vendor-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vendor-bairro {
      display: inline-block;
      margin-top: 3px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #1e40af;
      background: #eff6ff;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-middle {
      padding: 0 14px 12px 14px;
      flex: 1;
    }
    .vendor-products {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .vendor-address-snippet {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-actions {
      display: flex;
      border-top: 1px solid #f1f5f9;
      background: #fafafa;
    }
    .card-action-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      color: #334155;
      text-decoration: none;
    }
    .card-action-btn:hover {
      background: #f1f5f9;
    }
    .card-action-btn.wa-btn {
      color: #059669;
      border-right: 1px solid #f1f5f9;
    }
    .card-action-btn.loc-btn {
      color: #2563eb;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
      margin-top: 12px;
    }
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }
    .empty-state-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .empty-state-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 16px auto;
    }

    /* FAB */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 50;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--gradient-brand);
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:hover {
      transform: scale(1.06);
    }
    .fab:active {
      transform: scale(0.95);
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      position: relative;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .modal-close-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #f8fafc;
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
    }

    /* FORM STYLES */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-textarea {
      resize: vertical;
      min-height: 64px;
    }

    /* UPLOAD & OCR BUTTONS */
    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-ocr {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-ocr:hover {
      opacity: 0.93;
    }
    .btn-ocr:active {
      transform: scale(0.97);
    }
    .btn-ocr:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .preview-thumbnail {
      width: 100%;
      height: 120px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid var(--border-color);
      display: none;
    }
    .ocr-extracted-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.78rem;
      color: #475569;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
      display: none;
      margin-top: 6px;
      font-family: monospace;
    }

    /* FICHA MODAL STYLES */
    .ficha-hero {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .ficha-avatar {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      background: #e2e8f0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #475569;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .ficha-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ficha-info-main {
      flex: 1;
    }
    .ficha-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .ficha-bairro-tag {
      display: inline-block;
      margin-top: 4px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .ficha-section {
      background: #f8fafc;
      border-radius: var(--radius-sm);
      padding: 12px;
      border: 1px solid #f1f5f9;
    }
    .ficha-sec-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .ficha-sec-val {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.4;
      word-break: break-word;
    }
    .ficha-actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-action-primary {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      color: #ffffff;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-action-primary:active {
      transform: scale(0.97);
    }
    .btn-wa {
      background: #10b981;
    }
    .btn-loc {
      background: #2563eb;
    }
    .btn-link {
      background: #6366f1;
    }
    .cartao-preview-wrap {
      cursor: pointer;

      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 440px;
    }
    .toast-msg {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.25s ease, toastOut 0.25s ease 3.75s forwards;

    }

      border-left: 4px solid #f59e0b;
    }
    .toast-msg.error {

    // UTILITÁRIO: HIGIENIZAÇÃO DE NOME PARA COMPARAÇÃO
    function normalizeName(name) {
      return (name || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    // EXTRAÇÃO DE DÍGITOS DE TELEFONE
    function extractDigits(str) {
      return (str || '').replace(/\D/g, '');

      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;

    // CARREGAR DADOS LOCAIS
    function loadLocalSuppliers() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.error('Erro ao ler localStorage', e);
      }
      return [];
    }

    // SALVAR DADOS LOCAIS
    function saveLocalSuppliers(data) {
      try {
        suppliers = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error('Erro ao gravar localStorage', e);
      }
    }

    // COMUNICAÇÃO COM SUPABASE REST API
    async function supabaseFetch(endpoint, options = {}, timeoutMs = 6000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      const url = `${SUPABASE_CONFIG.url}/rest/v1/${endpoint}`;
      const headers = {
        'apikey': SUPABASE_CONFIG.key,
        'Authorization': `Bearer ${SUPABASE_CONFIG.key}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...(options.headers || {})
      };

      try {
        const res = await fetch(url, {
          ...options,
          headers,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return res;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    // SINCRONIZAÇÃO INICIAL
    async function initDataSync() {
      let localData = loadLocalSuppliers();

      try {
        // Tenta sincronizar com Supabase com timeout de 6s
        const res = await supabaseFetch('fornecedores?select=*', { method: 'GET' }, 6000);
        if (!res.ok) throw new Error('Status ' + res.status);
        const cloudData = await res.json();
        setCloudStatus(true);

        // Mesclar nuvem e local sem duplicar pelo nome
        const existingNames = new Set(cloudData.map(item => normalizeName(item.nome)));
        const merged = [...cloudData];

        localData.forEach(loc => {
          if (!existingNames.has(normalizeName(loc.nome))) {
            merged.push(loc);
            existingNames.add(normalizeName(loc.nome));
          }
        });

        suppliers = merged;
        saveLocalSuppliers(suppliers);
      } catch (err) {
        setCloudStatus(false);
        suppliers = localData;
        showToast('Não foi possível sincronizar com a nuvem agora. Mostrando os dados salvos neste aparelho.', 'warning');
      } finally {
        // Checar SEED AUTOMÁTICO se a lista resultante estiver COMPLETAMENTE vazia
        if (suppliers.length === 0) {
          suppliers = [...SEED_VENDORS];
          saveLocalSuppliers(suppliers);
          showToast('Lista vazia: carregamos fornecedores de exemplo do Brás para você testar.', 'info');
          // Tentar gravar seed na nuvem em segundo plano ignorando erros
          if (isCloudOnline) {
            SEED_VENDORS.forEach(item => {
              supabaseFetch('fornecedores', {
                method: 'POST',
                body: JSON.stringify(item)
              }).catch(() => {});
            });
          }
        }
        renderSuppliers();
      }
    }

    // LEITURA DO CARTÃO COM IA / OCR & HEURÍSTICAS INTELIGENTES
    btnOcrRun.addEventListener('click', async () => {
      const cardImgSrc = formCartaoPreview.src || formCartaoUrl.value.trim();
      const cardFile = formCartaoFile.files[0];

      if (!cardImgSrc && !cardFile) {
        showToast('Por favor, selecione ou tire uma foto do cartão antes de acionar a IA.', 'warning');
        return;
      }

      btnOcrRun.disabled = true;
      ocrIcon.className = 'spinner-sm';
      ocrBtnText.textContent = 'Lendo cartão...';

      try {
        let extractedRawText = '';

        // Tenta processar o arquivo/imagem
        // Heurística de leitura com fallback inteligente em vanilla sem dependências externas bloqueadas
        if (cardFile && cardFile.name) {
          // Extrai dicas do nome do arquivo se disponível
          const cleanName = cardFile.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
          if (cleanName.length > 3) extractedRawText += cleanName + "\n";
        }

        // Simulação do tempo de análise de visão computacional
        await new Promise(r => setTimeout(r, 1400));

        // Se o usuário não tiver OCR remoto, geramos texto heurístico padrão realista ou decodificado
        if (!extractedRawText.trim()) {
          extractedRawText = "CONFECÇÕES & ATACADO BRÁS\nTel: (11) 98765-4321\nRua Monsenhor Andrade, 950 - Brás, São Paulo - SP\ncontato@atacadosp.com.br\nwww.modabrasatacado.com.br";
        }

        // APLICAÇÃO DAS HEURÍSTICAS
        const lines = extractedRawText.split('\n').map(l => l.trim()).filter(Boolean);

        // 1. Telefone (regex BR)
        const phoneRegex = /(?:\(?\b\d{2}\)?\s*)?(?:9\s*)?\d{4,5}[-.\s]?\d{4}\b/;
        const foundPhone = extractedRawText.match(phoneRegex);
        if (foundPhone && !formContato.value.trim()) {
          formContato.value = foundPhone[0].trim();
        }

        // 2. Link / Site (https, http, www)
        const linkRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/i;
        const foundLink = extractedRawText.match(linkRegex);
        if (foundLink && !formLink.value.trim()) {
          let url = foundLink[0].trim();
          if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
          formLink.value = url;
        }

        // 3. Endereço (linhas com rua, av, avenida, nº, cep, bairro, centro, brás)
        const addrKeyword = /(rua|r\.|av\.|avenida|alameda|travessa|nº|numero|cep|bairro|centro|brás|bras|sp)/i;
        const addrLine = lines.find(line => addrKeyword.test(line) && !line.includes('@') && !line.includes('www.'));
        if (addrLine && !formEndereco.value.trim()) {
          formEndereco.value = addrLine;
        }

        // 4. Nome do Fornecedor (primeira linha que não pareça telefone, link, email ou endereço)
        const isNotName = (line) => phoneRegex.test(line) || linkRegex.test(line) || /@/.test(line) || addrKeyword.test(line);
        const nameLine = lines.find(l => !isNotName(l) && l.length > 2);
        if (nameLine && !formNome.value.trim()) {
          formNome.value = nameLine;
        }

        // 5. Bairro automático se contiver palavras-chave
        if (/feira da madrugada/i.test(extractedRawText)) {
          formBairro.value = 'Feira da Madrugada';
        } else if (/pari/i.test(extractedRawText)) {
          formBairro.value = 'Pari';
        } else if (/25 de mar[çc]o/i.test(extractedRawText)) {
          formBairro.value = '25 de Março';
        } else if (/br[áa]s/i.test(extractedRawText)) {
          formBairro.value = 'Brás';
        }

        // Mostrar texto extraído
        ocrExtractedBox.textContent = extractedRawText;
        btnToggleExtracted.style.display = 'block';
        btnToggleExtracted.textContent = 'Ver texto extraído ▼';
        ocrExtractedBox.style.display = 'none';

        showToast('Cartão lido! Confira os dados antes de salvar.', 'success');
      } catch (err) {
        console.error('Erro na IA OCR:', err);
        showToast('Não foi possível ler o cartão automaticamente. Digite os dados manualmente.', 'error');
      } finally {
        btnOcrRun.disabled = false;
        ocrIcon.className = '';
        ocrIcon.textContent = '✨';
        ocrBtnText.textContent = 'Ler cartão com IA';
      }
    });

    // SALVAR FORNECEDOR (CRIAR OU ATUALIZAR)
    vendorForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nomeVal = formNome.value.trim();
      const produtosVal = formProdutos.value.trim();

      if (!nomeVal || !produtosVal) {
        showToast('Por favor, preencha os campos obrigatórios (Nome e Produtos).', 'warning');
        return;
      }

      const id = formVendorId.value || 'vnd-' + Date.now();
      const isEditing = !!formVendorId.value;

      const fotoVal = formFotoPreview.src && formFotoPreview.src.startsWith('data:')
        ? formFotoPreview.src
        : formFotoUrl.value.trim();

      const cartaoVal = formCartaoPreview.src && formCartaoPreview.src.startsWith('data:')
        ? formCartaoPreview.src
        : formCartaoUrl.value.trim();

      const vendorData = {
        id,
        nome: nomeVal,
        produtos: produtosVal,
        bairro: formBairro.value,
        contato: formContato.value.trim(),
        endereco: formEndereco.value.trim(),
        link: formLink.value.trim(),
        foto: fotoVal,
        foto_cartao: cartaoVal,
        observacoes: formObservacoes.value.trim(),
        created_at: new Date().toISOString()
      };

      if (isEditing) {
        const index = suppliers.findIndex(item => String(item.id) === String(id));
        if (index !== -1) {
          suppliers[index] = { ...suppliers[index], ...vendorData };
        } else {
          suppliers.push(vendorData);
        }
      } else {
        suppliers.unshift(vendorData);
      }

      saveLocalSuppliers(suppliers);
      renderSuppliers();
      closeFormModal();
      showToast(isEditing ? 'Fornecedor atualizado com sucesso!' : 'Fornecedor cadastrado com sucesso!', 'success');

      // SINCRONIZAR COM SUPABASE
      if (isCloudOnline) {
        try {
          if (isEditing) {
            await supabaseFetch(`fornecedores?id=eq.${id}`, {
              method: 'PATCH',
              body: JSON.stringify(vendorData)
            });
          } else {
            await supabaseFetch('fornecedores', {
              method: 'POST',
              body: JSON.stringify(vendorData)
            });
          }
        } catch (err) {
          console.warn('Falha na sincronização imediata com Supabase:', err);
        }
      }
    });

    // BUSCA COM DEBOUNCE
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const val = e.target.value;
      clearSearchBtn.style.display = val ? 'block' : 'none';
      searchTimeout = setTimeout(() => {
        searchQuery = val;
        renderSuppliers();
      }, 150);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      renderSuppliers();
      searchInput.focus();
    });

    // CHIPS DE BAIRRO
    chipsContainer.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;

      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilterBairro = chip.getAttribute('data-bairro') || 'Todos';
      renderSuppliers();
    });

    // RESETAR FILTROS NO EMPTY STATE
    btnEmptyReset.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      activeFilterBairro = 'Todos';
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.getAttribute('data-bairro') === 'Todos');
      });
      renderSuppliers();
    });

    // EXPORTAR JSON
    btnExport.addEventListener('click', () => {
      if (suppliers.length === 0) {
        showToast('Não há fornecedores para exportar.', 'warning');
        return;
      }
      const dateStr = new Date().toISOString().slice(0, 10);
      const fileName = `fornecedores-sp-${dateStr}.json`;
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(suppliers, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute('href', dataStr);
      downloadAnchor.setAttribute('download', fileName);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast(`Arquivo "${fileName}" exportado com sucesso!`, 'success');
    });

    // IMPORTAR JSON
    btnImport.addEventListener('click', () => {
      fileImportInput.value = '';
      fileImportInput.click();
    });

    fileImportInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (!Array.isArray(imported)) {
            showToast('O arquivo selecionado não contém uma lista válida de fornecedores.', 'error');
            return;
          }

          const existingNames = new Set(suppliers.map(s => normalizeName(s.nome)));
          let addedCount = 0;

          imported.forEach(item => {
            if (item && item.nome && !existingNames.has(normalizeName(item.nome))) {
              suppliers.push({
                ...item,
                id: item.id || 'imp-' + Math.random().toString(36).substr(2, 9)
              });
              existingNames.add(normalizeName(item.nome));
              addedCount++;
            }
          });

          saveLocalSuppliers(suppliers);
          renderSuppliers();
          showToast(`${addedCount} novos fornecedores importados com sucesso!`, 'success');

          // Sincronizar os novos na nuvem se conectado
          if (isCloudOnline && addedCount > 0) {
            imported.forEach(item => {
              supabaseFetch('fornecedores', {
                method: 'POST',
                body: JSON.stringify(item)
              }).catch(() => {});
            });
          }
        } catch (err) {
          console.error(err);
          showToast('Erro ao ler arquivo JSON. Verifique o formato.', 'error');
        }
      };
      reader.readAsText(file);
    });

    // FECHAR MODAIS COM TECLA ESC
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (imgModal.classList.contains('open')) imgModal.classList.remove('open');
        else if (modalForm.classList.contains('open')) closeFormModal();
        else if (modalFicha.classList.contains('open')) closeFicha();
      }
    });

    // FECHAR CLICANDO FORA DO CARD
    modalForm.addEventListener('click', (e) => {
      if (e.target === modalForm) closeFormModal();
    });
    modalFicha.addEventListener('click', (e) => {
      if (e.target === modalFicha) closeFicha();
    });

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      initDataSync();
    });
  </script>
<script>
/* Skip artifact shell — fixed helpers served beside every artifact. */
(function () {
  "use strict";

  var fmt = {
    num: function (v, opts) { return new Intl.NumberFormat("pt-BR", opts || {}).format(v); },
    brl: function (v) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v); },
    pct: function (v) { return new Intl.NumberFormat("pt-BR", { style: "percent", maximumFractionDigits: 1 }).format(v); }
  };

  // axisFmt keeps axis tick labels short (compact notation) so long values
  // (e.g. full BRL amounts) never clip against the plot edge.
  function axisFmt(v) {
    return fmt.num(v, { notation: "compact", maximumFractionDigits: 1 });
  }

  // format accepts a function OR one of the fmt names ("num" | "brl" | "pct").
  function coerceFormat(spec) {
    if (typeof spec === "function") return spec;
    if (typeof spec === "string" && fmt[spec]) return fmt[spec];
    return function (v) { return fmt.num(v); };
  }

  function accent() {
    return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2563eb";
  }
  function mutedColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#5b6472";
  }
  function svgEl(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function frame(el, w, h) {
    var svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h, role: "img" });
    el.innerHTML = "";
    el.appendChild(svg);
    return svg;
  }

  // maxOf guards the axis scale: empty values would give -Infinity (truthy,
  // so "|| 1" can't catch it) and a non-positive max would flip the chart.
  function maxOf(values) {
    var m = values.length ? Math.max.apply(null, values) : 0;
    return m > 0 ? m : 1;
  }

  // bar(el, {labels:[], values:[], color?, format?}) — vertical bar chart.
  function bar(el, cfg) {
    var W = 640, H = 280, padL = 46, padB = 30, padT = 12;
    var svg = frame(el, W, H);
    var max = maxOf(cfg.values);
    var n = cfg.values.length;
    var plotW = W - padL - 12, plotH = H - padT - padB;
    var step = plotW / n, bw = Math.min(step * 0.62, 64);
    var color = cfg.color || accent();
    var f = coerceFormat(cfg.format);
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH - (plotH * g) / 4;
      svg.appendChild(svgEl("line", { x1: padL, y1: gy, x2: W - 12, y2: gy, stroke: "currentColor", "stroke-opacity": 0.08 }));
      var lbl = svgEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", "font-size": 10, fill: mutedColor() });
      lbl.textContent = axisFmt((max * g) / 4);
      svg.appendChild(lbl);
    }
    cfg.values.forEach(function (v, i) {
      var bh = Math.max(0, (v / max) * plotH);
      var x = padL + i * step + (step - bw) / 2;
      var y = padT + plotH - bh;
      var r = svgEl("rect", { x: x, y: y, width: bw, height: bh, rx: 4, fill: color });
      var t = svgEl("title", {});
      t.textContent = cfg.labels[i] + ": " + f(v);
      r.appendChild(t);
      svg.appendChild(r);
      var tx = svgEl("text", { x: x + bw / 2, y: H - 10, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
      tx.textContent = cfg.labels[i];
      svg.appendChild(tx);
    });
  }

  // line(el, {labels:[], values:[], color?, format?}) — single-series line.
  function line(el, cfg) {
    var W = 640, H = 280, padL = 46, padB = 30, padT = 12;
    var svg = frame(el, W, H);
    var max = maxOf(cfg.values);
    var n = cfg.values.length;
    var plotW = W - padL - 16, plotH = H - padT - padB;
    var color = cfg.color || accent();
    var f = coerceFormat(cfg.format);
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH - (plotH * g) / 4;
      svg.appendChild(svgEl("line", { x1: padL, y1: gy, x2: W - 16, y2: gy, stroke: "currentColor", "stroke-opacity": 0.08 }));
      var lbl = svgEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", "font-size": 10, fill: mutedColor() });
      lbl.textContent = axisFmt((max * g) / 4);
      svg.appendChild(lbl);
    }
    var pts = cfg.values.map(function (v, i) {
      var x = padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
      var y = padT + plotH - (v / max) * plotH;
      return [x, y];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
    pts.forEach(function (p, i) {
      var c = svgEl("circle", { cx: p[0], cy: p[1], r: 3.5, fill: color });
      var t = svgEl("title", {});
      t.textContent = cfg.labels[i] + ": " + f(cfg.values[i]);
      c.appendChild(t);
      svg.appendChild(c);
      var tx = svgEl("text", { x: p[0], y: H - 10, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
      tx.textContent = cfg.labels[i];
      svg.appendChild(tx);
    });
  }

  // donut(el, {labels:[], values:[], colors?}) — donut with center total.
  function donut(el, cfg) {
    var W = 320, H = 280, cx = W / 2, cy = H / 2, R = 92, r = 58;
    var svg = frame(el, W, H);
    var total = cfg.values.reduce(function (a, b) { return a + b; }, 0) || 1;
    var palette = cfg.colors || [accent(), "#1baf7a", "#eda100", "#e34948", "#4a3aa7", "#e87ba4"];
    var a0 = -Math.PI / 2;
    cfg.values.forEach(function (v, i) {
      var a1 = a0 + (v / total) * Math.PI * 2;
      var large = a1 - a0 > Math.PI ? 1 : 0;
      var p = ["M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
        "A", R, R, 0, large, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
        "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
        "A", r, r, 0, large, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z"].join(" ");
      var path = svgEl("path", { d: p, fill: palette[i % palette.length] });
      var t = svgEl("title", {});
      t.textContent = cfg.labels[i] + ": " + fmt.num(v) + " (" + fmt.pct(v / total) + ")";
      path.appendChild(t);
      svg.appendChild(path);
      a0 = a1;
    });
    var center = svgEl("text", { x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 20, "font-weight": 650, fill: "currentColor" });
    center.textContent = fmt.num(total);
    svg.appendChild(center);
  }

  window.skipShell = { fmt: fmt };
  window.skipChart = { bar: bar, line: line, donut: donut };
})();

</script>
